{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cromf Finanzas - Iniciar sesión</title>
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body class="login-page">

  <main class="login-card">

    <!-- Columna izquierda: formulario -->
    <section class="login-left">
      <div>
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M3 17l6-6 4 4 8-8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M15 7h6v6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Cromf Finanzas</span>
        </div>

        <div class="login-header">
          <h1>Iniciar sesión</h1>
        </div>

        {% if form.non_field_errors %}
          <p class="error-message">Usuario o contraseña incorrectos.</p>
        {% endif %}

        <form method="post" action="{% url 'login' %}" class="login-form">
          {% csrf_token %}

          <div class="form-group">
            <label for="{{ form.username.id_for_label }}">Usuario</label>
            {{ form.username }}
          </div>

          <div class="form-group">
            <label for="{{ form.password.id_for_label }}">Contraseña</label>
            {{ form.password }}
          </div>

          <input type="hidden" name="next" value="{{ next }}">

          <button type="submit" class="btn-login">Iniciar sesión</button>
        </form>

        <p style="margin-top: 16px; font-size: 0.8rem;">
          <a href="{% url 'recuperacion_solicitar' %}" style="color:#6B7280; text-decoration:none;">¿Olvidaste tu contraseña?</a>
        </p>
      </div>
    </section>

    <!-- Columna derecha: branding -->
    <section class="login-right">
      <div class="graphic-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M3 21h18" stroke-linecap="round"/>
          <path d="M5 21V7l8-4v18" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M19 21V11l-6-3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9 9h1" stroke-linecap="round"/>
          <path d="M9 13h1" stroke-linecap="round"/>
          <path d="M9 17h1" stroke-linecap="round"/>
        </svg>
      </div>
      <h2>CROMF FINANZAS</h2>
      <p>Sistema de Gestión Empresarial</p>
    </section>

  </main>

</body>
</html>
