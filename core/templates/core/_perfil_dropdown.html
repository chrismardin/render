{% load static %}
<!-- ============================================================
     PERFIL DE USUARIO + MENU DESPLEGABLE
     Componente reutilizable (se incluye desde el admin-area de
     cada página). Un solo lugar para mantener la interacción del
     dropdown, en vez de repetirla 13 veces.

     - Avatar: iniciales del usuario (sin imagen, sin librería).
     - Nombre y rol: datos reales del usuario autenticado
       (rol_actual viene de core/context_processors.py, que lee
       los mismos grupos de Django que ya usa permisos.py).
     - "Configuración" solo aparece si puede_ver_configuracion.
     - "Cerrar sesión" sigue siendo un POST con csrf_token
       (no se convirtió en un enlace GET).
     ============================================================ -->
<div class="user-profile-dropdown">
  <button type="button" class="profile-trigger" id="userMenuBtn" aria-expanded="false" aria-haspopup="true" aria-label="Abrir menú del usuario">
    <span class="avatar" aria-hidden="true">{{ user.get_username|first|upper }}</span>
    <span class="user-info">
      <span class="user-name">{{ user.get_username }}</span>
      <span class="user-role">{{ rol_actual|default:"Sin rol asignado" }}</span>
    </span>
    <svg class="chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <polyline points="6 9 12 15 18 9"/>
    </svg>
  </button>

  <div class="dropdown-menu" id="userDropdown" role="menu" aria-label="Menú de usuario">
    {% if puede_ver_configuracion %}
    <a href="{% url 'configuracion' %}" class="dropdown-item" role="menuitem">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09c.7 0 1.27-.4 1.51-1a1.65 1.65 0 0 0-.33-1.82l-.06-.06A2 2 0 1 1 6.2 2.2l.06.06c.46.46 1.02.7 1.62.7H9a1.65 1.65 0 0 0 1.51-1C10.8 1.4 11.5 1 12 1s1.2.4 1.49 1c.24.6.99 1 1.51 1h1.12c.6 0 1.16-.24 1.62-.70l.06-.06A2 2 0 1 1 20.8 6.2l-.06.06c-.46.46-.7 1.02-.7 1.62V9c0 .51.39 1.04 1 1.51z"/></svg>
      <span>Configuración</span>
    </a>
    <hr class="dropdown-divider">
    {% endif %}
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit" class="dropdown-item logout-btn" role="menuitem">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Cerrar sesión</span>
      </button>
    </form>
  </div>
</div>
